[project]
name = "tower"
version = "0.1.0"
description = "Tower: a NATS JetStream event bus with a small Python kit for publishing, subscribing and handling events."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.5",
    "nats-py>=2.9",
]

[project.scripts]
tower = "tower.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tower"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs the live bus (TOWER_NATS_URL and token file)"]
